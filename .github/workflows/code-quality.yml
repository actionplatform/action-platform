name: Code Quality

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actionplatform/ci-github/setup@v1
      - uses: actionplatform/ci-github/check@v1

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actionplatform/ci-github/setup@v1
      - run: poetry run pip install -e apps/api
      - run: poetry run ruff check apps/api && poetry run ruff format --check apps/api
      - run: |
          python="$(poetry run python -c 'import sys; print(sys.executable)')"
          cd apps/api && "$python" -m pytest -q
