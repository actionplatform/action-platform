# Container images for self-hosting, one per release component:
#   api/vX.Y.Z → actionplatformio/action-platform-api    web/vX.Y.Z → actionplatformio/action-platform-web
# Published to Docker Hub (official, what the compose file pulls) and GHCR
# (mirror, no pull rate limit). Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
name: Images

on:
  push:
    tags:
      - "api/v[0-9]+.[0-9]+.[0-9]+"
      - "api/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "web/v[0-9]+.[0-9]+.[0-9]+"
      - "web/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      component:
        description: api or web
        required: true
        type: choice
        options: [api, web]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPONENT: ${{ inputs.component || '' }}
    steps:
      - uses: actions/checkout@v4
      - id: which
        run: |
          ref="${GITHUB_REF_NAME}"
          comp="${COMPONENT:-${ref%%/*}}"
          version="${ref#*/v}"
          [ "$version" = "$ref" ] && version="$(cat "$([ "$comp" = web ] && echo apps/web || echo action_platform/api)/LAST_VERSION")"
          echo "component=$comp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-rc.*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'actionplatformio' }}/action-platform-${{ steps.which.outputs.component }}
            ghcr.io/${{ github.repository_owner }}/action-platform-${{ steps.which.outputs.component }}
          tags: |
            type=raw,value=${{ steps.which.outputs.version }}
            type=raw,value=latest,enable=${{ steps.which.outputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ steps.which.outputs.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.which.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ steps.which.outputs.component }}
