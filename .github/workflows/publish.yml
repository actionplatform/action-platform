name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release of the library to publish (without the v prefix); the workflow runs on its tag
        required: true
      registry:
        description: pypi or testpypi — the platform picks it from the scope's criticality
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
      url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/p/action-platform' || 'https://pypi.org/p/action-platform' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry version "${{ inputs.version }}" && poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
