name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release of the library to publish (without the v prefix); the workflow runs on its tag
        required: true
      registry:
        description: pypi or testpypi — the platform picks it from the scope's criticality
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
      url: ${{ inputs.registry == 'testpypi' && 'https://test.pypi.org/p/action-platform' || 'https://pypi.org/p/action-platform' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actionplatform/ci-github/setup@v1
      - uses: actionplatform/ci-github/publish@v1
        with:
          version: ${{ inputs.version }}
          registry: ${{ inputs.registry }}
