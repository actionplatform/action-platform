name: 🔍 Code Quality

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
  workflow_call:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}

      - name: 🔍 golangci-lint (Linting)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          go-version: ${{ matrix.go-version }}

      - name: 🎨 gofmt (Format Check)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "$UNFORMATTED"
            echo "::error::Run 'gofmt -w .' locally to fix the files above."
            exit 1
          fi

      - name: ✅ Code Quality Summary
        if: always()
        run: |
          echo "### Code Quality Checks Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Go Version: ${{ matrix.go-version }}" >> $GITHUB_STEP_SUMMARY
          echo "All code quality tools have been executed." >> $GITHUB_STEP_SUMMARY
