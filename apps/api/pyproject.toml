[project]
name = "action-platform-api"
version = "0.16.0"
description = "The hosted Action Platform: accounts, organizations, apps and jobs over the action-platform library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "action-platform",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "cryptography>=42",
  "sentry-sdk[fastapi]>=2.0",
  "typer>=0.15",
]

[project.scripts]
action-platform-api = "action_platform_api.core.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "httpx2", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
action_platform_api = ["LAST_VERSION", "core/db/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"core/db/database.py" = ["E402"]
