[project]
name = "action-platform-api"
version = "0.16.0"
description = "The hosted Action Platform: accounts, organizations, apps and jobs over the action-platform library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "action-platform",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "cryptography>=50",
  "sentry-sdk[fastapi]>=2.0",
  "typer>=0.15",
  "apx-aws-lambda>=0.5.0",
]

[project.scripts]
action-platform-api = "app.cli:main"

[tool.poetry]
packages = [{ include = "app" }]
include = [
  { path = "app/LAST_VERSION", format = ["sdist", "wheel"] },
  { path = "app/core/db/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
action-platform = { path = "../..", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
httpx = "^0.28.1"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
