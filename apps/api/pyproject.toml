[project]
name = "action-platform-api"
version = "0.16.0"
description = "The hosted Action Platform: accounts, organizations, apps and jobs over the action-platform library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "action-platform",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "cryptography>=42",
  "sentry-sdk[fastapi]>=2.0",
  "typer>=0.15",
]

[project.scripts]
action-platform-api = "action_platform_api.core.cli:main"

[tool.poetry]
packages = [{ include = "action_platform_api" }]
include = [
  { path = "action_platform_api/LAST_VERSION", format = ["sdist", "wheel"] },
  { path = "action_platform_api/core/db/migrations/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.12"
action-platform = { path = "../..", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
httpx = "^0.28.1"
httpx2 = "*"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"action_platform_api/core/db/database.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
