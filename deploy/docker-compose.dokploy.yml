name: action-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_platform
      POSTGRES_USER: action_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${AP_IMAGE_API:-actionplatformio/action-platform-api:latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["7788"]
    volumes:
      - apdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@postgres:5432/action_platform
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}

  web:
    image: ${AP_IMAGE_WEB:-actionplatformio/action-platform-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    expose: ["3000"]
    volumes:
      - webconfig:/app/config
    environment:
      AP_API: http://api:7788
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      SENTRY_DSN: ${AP_SENTRY_DSN_WEB:-}
      DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@postgres:5432/action_platform
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}

volumes:
  pgdata:
  apdata:
  webconfig:
