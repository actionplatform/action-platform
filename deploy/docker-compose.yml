# Action Platform on one host. `install.sh` writes .env and runs this.
#   docker compose up -d                       # http://<host>:3000
#   docker compose --profile tls up -d         # + Traefik with Let's Encrypt on ${DOMAIN}
name: action-platform

services:
  traefik:
    image: traefik:v3.3
    profiles: ["tls"]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_platform
      POSTGRES_USER: action_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${AP_IMAGE_API:-ghcr.io/actionplatform/action-platform-api:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    # Never published: only `web` reaches it, on the compose network.
    expose: ["7788"]
    volumes:
      - apdata:/data
    environment:
      # Tokens for deploys that need them; source-host tokens come per request from `web`.
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}

  web:
    image: ${AP_IMAGE_WEB:-ghcr.io/actionplatform/action-platform-web:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - webconfig:/app/config
    environment:
      AP_API: http://api:7788
      # Setting these skips the database step of the wizard; the admin and
      # organization steps still run on first visit.
      DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@postgres:5432/action_platform
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL}
      # Optional OAuth apps (else set them in the UI):
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  letsencrypt:
  pgdata:
  apdata:
  webconfig:
