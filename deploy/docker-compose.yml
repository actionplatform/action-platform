name: action-platform

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  traefik:
    image: traefik:v3.3
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - docker-proxy
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - default

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_platform
      POSTGRES_USER: action_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    profiles: ["pooler"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: action_platform
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: action_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${AP_IMAGE_API:-actionplatformio/action-platform-api:latest}
    pull_policy: always
    restart: "no"
    command: ["action-platform-api", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_DB_HOST: ${AP_DB_HOST:-postgres}
      AP_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]

  api:
    image: ${AP_IMAGE_API:-actionplatformio/action-platform-api:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    expose: ["7788"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AP_API_TOKEN_FILE: /run/secrets/api_token
      AP_API_WORKERS: ${AP_API_WORKERS:-2}
      AP_DB_HOST: ${AP_DB_HOST:-postgres}
      AP_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}
    secrets: [postgres_password, better_auth_secret, api_token]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7788/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${AP_IMAGE_WORKER:-actionplatformio/action-platform-worker:latest}
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: ["action-platform-api", "worker", "--concurrency", "${AP_WORKER_CONCURRENCY:-2}", "--kinds", "sync,release,push,import,import_github"]
    environment:
      AP_API_TOKEN_FILE: /run/secrets/api_token
      AP_DB_HOST: ${AP_DB_HOST:-postgres}
      AP_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}
    secrets: [postgres_password, better_auth_secret, api_token]

  worker-deploy:
    image: ${AP_IMAGE_WORKER:-actionplatformio/action-platform-worker:latest}
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: ["action-platform-api", "worker", "--concurrency", "${AP_DEPLOY_CONCURRENCY:-1}", "--kinds", "deploy,readiness,destroy,destroy_project,destroy_organization", "--name", "deploy"]
    environment:
      AP_API_TOKEN_FILE: /run/secrets/api_token
      AP_DB_HOST: ${AP_DB_HOST:-postgres}
      AP_DB_PASSWORD_FILE: /run/secrets/postgres_password
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}
    secrets: [postgres_password, better_auth_secret, api_token]

  web:
    image: ${AP_IMAGE_WEB:-actionplatformio/action-platform-web:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      AP_API: http://api:7788
      SENTRY_DSN: ${AP_SENTRY_DSN_WEB:-}
      PUBLIC_URL: ${PUBLIC_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  letsencrypt:
  pgdata:

networks:
  edge:
    internal: true

secrets:
  postgres_password:
    file: ${AP_SECRETS_DIR:-./secrets}/postgres_password
  better_auth_secret:
    file: ${AP_SECRETS_DIR:-./secrets}/better_auth_secret
  api_token:
    file: ${AP_SECRETS_DIR:-./secrets}/api_token
