name: action-platform

services:
  traefik:
    image: traefik:v3.3
    profiles: ["tls"]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_platform
      POSTGRES_USER: action_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${AP_IMAGE_API:-actionplatformio/action-platform-api:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    expose: ["7788"]
    volumes:
      - apdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@postgres:5432/action_platform
      AP_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}

  worker:
    image: ${AP_IMAGE_API:-actionplatformio/action-platform-api:latest}
    pull_policy: always
    restart: unless-stopped
    command: ["action-platform", "worker"]
    volumes:
      - apdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@postgres:5432/action_platform
      AP_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}

  web:
    image: ${AP_IMAGE_WEB:-actionplatformio/action-platform-web:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      AP_API: http://api:7788
      SENTRY_DSN: ${AP_SENTRY_DSN_WEB:-}
      PUBLIC_URL: ${PUBLIC_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  letsencrypt:
  pgdata:
  apdata:
