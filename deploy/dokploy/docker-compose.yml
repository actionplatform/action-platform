name: action-platform

services:
  ap-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: action_platform
      POSTGRES_USER: action_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  ap-pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    profiles: ["pooler"]
    depends_on:
      ap-postgres:
        condition: service_healthy
    environment:
      DB_HOST: ap-postgres
      DB_USER: action_platform
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: action_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U action_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  ap-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      ap-postgres:
        condition: service_healthy
    environment:
      PGHOST: ap-postgres
      PGUSER: action_platform
      PGDATABASE: action_platform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AP_BACKUP_HOUR: ${AP_BACKUP_HOUR:-3}
      AP_BACKUP_KEEP_DAYS: ${AP_BACKUP_KEEP_DAYS:-7}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -o pipefail
        hour=$${AP_BACKUP_HOUR#0}
        while :; do
          file=/backups/action_platform-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          if pg_dump --no-owner --no-privileges | gzip > "$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "wrote $$file"
          else
            rm -f "$$file.partial"
            echo "backup failed" >&2
          fi
          find /backups -name 'action_platform-*.sql.gz' -mtime +"$$AP_BACKUP_KEEP_DAYS" -delete
          now=$$(date -u +%s)
          wait=$$(( (hour * 3600 - now % 86400 + 86400) % 86400 ))
          sleep $$(( wait > 0 ? wait : 86400 ))
        done

  ap-migrate:
    image: ${AP_IMAGE_API:?set AP_IMAGE_API in .env, e.g. actionplatformio/action-platform-api:X.Y.Z}
    restart: "no"
    command: ["action-platform-api", "db", "migrate"]
    depends_on:
      ap-postgres:
        condition: service_healthy
    environment:
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@${AP_DB_HOST:-ap-postgres}:5432/action_platform

  ap-api:
    image: ${AP_IMAGE_API:?set AP_IMAGE_API in .env, e.g. actionplatformio/action-platform-api:X.Y.Z}
    restart: unless-stopped
    expose: ["7788"]
    depends_on:
      ap-postgres:
        condition: service_healthy
      ap-migrate:
        condition: service_completed_successfully
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_API_WORKERS: ${AP_API_WORKERS:-2}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@${AP_DB_HOST:-ap-postgres}:5432/action_platform
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}
      AP_SMTP_HOST: ${AP_SMTP_HOST:-}
      AP_SMTP_PORT: ${AP_SMTP_PORT:-}
      AP_SMTP_USER: ${AP_SMTP_USER:-}
      AP_SMTP_PASSWORD: ${AP_SMTP_PASSWORD:-}
      AP_SMTP_FROM: ${AP_SMTP_FROM:-}
      AP_SMTP_SECURITY: ${AP_SMTP_SECURITY:-starttls}
      AP_GOOGLE_CLIENT_ID: ${AP_GOOGLE_CLIENT_ID:-}
      AP_GOOGLE_CLIENT_SECRET: ${AP_GOOGLE_CLIENT_SECRET:-}

  ap-worker:
    image: ${AP_IMAGE_WORKER:?set AP_IMAGE_WORKER in .env, e.g. actionplatformio/action-platform-worker:X.Y.Z}
    restart: unless-stopped
    depends_on:
      ap-postgres:
        condition: service_healthy
      ap-migrate:
        condition: service_completed_successfully
      ap-api:
        condition: service_started
    command: ["action-platform-api", "worker", "--concurrency", "${AP_WORKER_CONCURRENCY:-2}", "--kinds", "sync,release,push,import,import_github,install", "--name", "worker"]
    healthcheck:
      test: ["CMD", "action-platform-api", "worker", "--check", "--name", "worker"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@${AP_DB_HOST:-ap-postgres}:5432/action_platform
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}
      AP_SMTP_HOST: ${AP_SMTP_HOST:-}
      AP_SMTP_PORT: ${AP_SMTP_PORT:-}
      AP_SMTP_USER: ${AP_SMTP_USER:-}
      AP_SMTP_PASSWORD: ${AP_SMTP_PASSWORD:-}
      AP_SMTP_FROM: ${AP_SMTP_FROM:-}
      AP_SMTP_SECURITY: ${AP_SMTP_SECURITY:-starttls}
      AP_GOOGLE_CLIENT_ID: ${AP_GOOGLE_CLIENT_ID:-}
      AP_GOOGLE_CLIENT_SECRET: ${AP_GOOGLE_CLIENT_SECRET:-}

  ap-worker-deploy:
    image: ${AP_IMAGE_WORKER:?set AP_IMAGE_WORKER in .env, e.g. actionplatformio/action-platform-worker:X.Y.Z}
    restart: unless-stopped
    depends_on:
      ap-postgres:
        condition: service_healthy
      ap-migrate:
        condition: service_completed_successfully
      ap-api:
        condition: service_started
    command: ["action-platform-api", "worker", "--concurrency", "${AP_DEPLOY_CONCURRENCY:-1}", "--kinds", "deploy,readiness,destroy,destroy_project,destroy_organization", "--name", "deploy"]
    healthcheck:
      test: ["CMD", "action-platform-api", "worker", "--check", "--name", "deploy"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    environment:
      AP_API_TOKEN: ${AP_API_TOKEN:-}
      AP_DATABASE_URL: postgres://action_platform:${POSTGRES_PASSWORD}@${AP_DB_HOST:-ap-postgres}:5432/action_platform
      AP_DATABASE_AUTO_MIGRATE: "0"
      AP_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AP_PUBLIC_URL: ${PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
      ACTION_PLATFORM_TEMPLATES_REPO: ${ACTION_PLATFORM_TEMPLATES_REPO:-https://github.com/actionplatform/templates.git}
      ACTION_PLATFORM_GIT_HOSTS: ${ACTION_PLATFORM_GIT_HOSTS:-}
      AP_SENTRY_DSN: ${AP_SENTRY_DSN_API:-}

  ap-web:
    image: ${AP_IMAGE_WEB:?set AP_IMAGE_WEB in .env, e.g. actionplatformio/action-platform-web:X.Y.Z}
    restart: unless-stopped
    depends_on:
      ap-api:
        condition: service_started
    expose: ["3000"]
    environment:
      AP_API: http://ap-api:7788
      SENTRY_DSN: ${AP_SENTRY_DSN_WEB:-}
      PUBLIC_URL: ${PUBLIC_URL}

volumes:
  pgdata:
  backups:
