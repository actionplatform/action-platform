[project]
name = "action-platform"
language = "python"

[source_host]
kind = "github"
repo = "actionplatform/action-platform"

[release]
strategy = "semver"
changelog = "conventional"

# Parts that version on their own: tag <name>/vX.Y.Z, LAST_VERSION and
# CHANGELOG.md under `path`. The root (vX.Y.Z) is the library + CLI on PyPI.
[components.web]
path = "apps/web"

[components.api]
path = "apps/api/app"

# The root component on PyPI: the platform deploys a release to a scope by
# dispatching publish.yml on its tag; a `test` scope publishes to TestPyPI.
[[deploy.targets]]
name = "pypi"
kind = "pypi"
run_by = "github_actions"
workflow = "publish.yml"
package = "action-platform"
