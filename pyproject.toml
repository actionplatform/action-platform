[project]
name = "action-platform"
version = "0.6.5"
authors = [
  { name="Fernando Celmer", email="email@fernandocelmer.com" },
]
license = {file = "LICENSE"}
description = "Your platform team, as a CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich",
  "pydantic",
  "typing-extensions",
  "typer",
  "jinja2",
  "python-ulid (>=3.0)",
  "cookiecutter",
]
keywords = [
  "scaffolding",
  "cookiecutter",
  "devops",
  "platform-engineering",
  "internal-developer-platform",
  "ci",
  "cd",
  "release",
  "deploy",
  "github",
  "gitlab",
  "jenkins",
  "aws",
  "lambda",
  "amplify",
  "docker",
  "git-flow",
  "conventional-commits",
  "mcp",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Software Distribution",
  "Topic :: System :: Systems Administration",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/actionplatform/action-platform"
Repository = "https://github.com/actionplatform/action-platform"
Issues = "https://github.com/actionplatform/action-platform/issues"
Changelog = "https://github.com/actionplatform/action-platform/blob/master/CHANGELOG.md"
Templates = "https://github.com/actionplatform/templates"
Organization = "https://github.com/actionplatform"

[project.optional-dependencies]
github = ["PyGithub"]
gitlab = ["python-gitlab"]
mcp = ["mcp>=2.0"]
sentry = ["sentry-sdk>=2.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "sentry-sdk[fastapi]>=2.0"]

[tool.poetry]
name = "action-platform"
version = "0.6.5"
description = "Your platform team, as a CLI."
authors = ["Fernando Celmer <email@fernandocelmer.com>"]
readme = "README.md"
license = "Apache-2.0"
package-mode = true
homepage = "https://github.com/actionplatform/action-platform"
repository = "https://github.com/actionplatform/action-platform"

packages = [{ include = "action_platform" }]
include = [
  { path = "action_platform/hooks/*", format = ["sdist", "wheel"] },
  { path = "action_platform/api/LAST_VERSION", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
action-platform = "action_platform.main:main"
action-platform-mcp = "action_platform.mcp.server:main"

[tool.poetry.extras]
mcp = ["mcp"]
sentry = ["sentry-sdk"]
api = ["fastapi", "uvicorn", "sentry-sdk"]


[tool.poetry.dependencies]
python = ">=3.10.0"
rich = "^14.1.0"
pydantic = "^2.11.7"
typing-extensions = "^4.14.1"
typer = "^0.15.0"
jinja2 = "^3.1.4"
python-ulid = "^3.0.0"
cookiecutter = "^2.6.0"
mcp = { version = ">=2.0", optional = true }
fastapi = { version = ">=0.115", optional = true }
uvicorn = { version = ">=0.30", optional = true }
sentry-sdk = { version = ">=2.0", optional = true, extras = ["fastapi"] }

[tool.poetry.group.dev.dependencies]
build = "^1.2.2.post1"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
flake8 = "^7.1.1"
httpx = "^0.28.1"

[tool.poetry.group.code-quality.dependencies]
ruff = "^0.9.0"
mypy = "^1.13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
